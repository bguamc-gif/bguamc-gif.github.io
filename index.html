<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מעבדת תלת־ממד</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--fdm:#e8590c;--sla:#7048e8;--sls:#0c8599;--grn:#2b8a3e;--pnk:#c2255c;--yel:#e67700;--bg:#fff;--soft:#f6f7f9;--tx:#111827;--mut:#4b5563;--ln:#e5e7eb;--ac:#0f4c81;--acs:#eaf1f8;--ok:#15803d;--mid:#a15c07;--bad:#b91c1c;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.75 Heebo,system-ui,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--ac)}
:focus-visible{outline:3px solid var(--ac);outline-offset:3px;border-radius:6px}
.skip{position:absolute;right:16px;top:-60px;background:var(--ac);color:#fff;padding:8px 14px;border-radius:8px;z-index:100}.skip:focus{top:10px}
.wrap{max-width:1080px;margin:auto;padding:0 20px}
/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
.hb{display:flex;align-items:center;gap:14px;min-height:68px}
.logo{display:flex;flex-direction:column;line-height:1.15;text-decoration:none;color:var(--tx);margin-inline-end:auto}
.logo b{font-size:1.15rem;font-weight:800}.logo span{font-size:.8rem;color:var(--mut)}
.menu{display:none;background:none;border:1px solid var(--ln);border-radius:10px;padding:8px 12px;font:inherit;font-size:.95rem;cursor:pointer;color:var(--tx)}
nav ul{list-style:none;margin:0;padding:0}
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.it{position:relative}
.top{display:flex;align-items:center;gap:6px;background:none;border:0;font:inherit;font-size:.98rem;font-weight:500;color:var(--tx);padding:10px 12px;border-radius:10px;cursor:pointer;text-decoration:none}
.top small{color:var(--mut);font-weight:400}
button.top::after{content:"";width:7px;height:7px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg) translateY(-2px);opacity:.6}
.top:hover,.it.open>.top,.top[aria-current="page"]{background:var(--soft);color:var(--ac)}
.cta,.cta[aria-current]{background:var(--ac)!important;color:#fff!important;font-weight:700}.cta:hover{background:#0b3a63!important}
.dd{position:absolute;top:100%;right:0;min-width:250px;background:#fff;border:1px solid var(--ln);border-radius:14px;box-shadow:0 16px 40px rgba(17,24,39,.10);padding:8px;opacity:0;visibility:hidden;transform:translateY(6px);transition:.18s}
.dd a{display:block;padding:9px 12px;border-radius:9px;color:var(--tx);text-decoration:none;font-size:.97rem}
.dd a:hover,.dd a:focus-visible{background:var(--acs);color:var(--ac)}
.dd .hint{display:block;font-size:.8rem;color:var(--mut)}
.has{position:relative}.has>a::after{content:" ›";color:var(--mut)}
.sub{position:absolute;top:-8px;right:100%;min-width:210px;background:#fff;border:1px solid var(--ln);border-radius:14px;box-shadow:0 16px 40px rgba(17,24,39,.10);padding:8px;opacity:0;visibility:hidden;transition:.15s}
@media (hover:hover) and (min-width:901px){.it:hover>.dd{opacity:1;visibility:visible;transform:none}.has:hover>.sub{opacity:1;visibility:visible}}
.it.open>.dd,.it:focus-within>.dd{opacity:1;visibility:visible;transform:none}.has:focus-within>.sub{opacity:1;visibility:visible}

@media (max-width:1240px){.top small{display:none}}
@media (max-width:900px){
 header{position:static}
 .hb{flex-wrap:wrap;gap:6px;padding:10px 0}
 nav{width:100%}
 .nav{position:relative;gap:6px}
 .it{position:static}
 .top{padding:7px 11px;font-size:.92rem;background:var(--soft);border-radius:9px}
 .dd{left:0;right:0;min-width:0;top:calc(100% + 4px)}
 .sub{position:static;opacity:1;visibility:visible;box-shadow:none;border:0;padding:0 14px 4px;min-width:0}
 .has>a::after{content:""}
}
.q{margin:0 0 14px}.q b{display:block;margin-bottom:6px}.q .chips{margin:0}
.qr{background:#fff;border-radius:12px;padding:14px 16px;margin:10px 0}.qr h3{margin:0!important;color:var(--c,var(--ac))}.qr p{margin:.2em 0 .4em;color:var(--mut);font-size:.97rem}
.qv{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.88rem;color:var(--mut)}.qv b{color:var(--tx)}
/* content */
main{min-height:60vh}
section{padding:72px 0}
.alt{background:var(--soft)}
h1{font-size:clamp(2.1rem,5vw,3.4rem);line-height:1.15;font-weight:800;margin:.1em 0 .35em;letter-spacing:-.5px}
h2{font-size:clamp(1.5rem,3vw,2rem);line-height:1.25;margin:0 0 .4em;font-weight:800}
h3{font-size:1.15rem;margin:0 0 .25em;font-weight:700}
.lead{font-size:1.2rem;color:var(--mut);max-width:60ch}
.kick{color:var(--ac);font-weight:700;font-size:.9rem;letter-spacing:.3px}
.sec-h{margin-bottom:36px;max-width:62ch}.sec-h p{color:var(--mut);margin:0}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:12px;background:var(--ac);color:#fff;text-decoration:none;font-weight:700;border:2px solid var(--ac);font:inherit;font-weight:700;cursor:pointer}
.btn:hover{background:#0b3a63}
.btn.ghost{background:#fff;color:var(--ac)}.btn.ghost:hover{background:var(--acs)}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.hero{padding:88px 0 64px}
.hero-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:center}
.hero-art{color:var(--ac)}
@media(max-width:820px){.hero-grid{grid-template-columns:1fr}.hero-art{max-width:300px}}
.ic{width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--c,var(--ac)) 12%,#fff);color:var(--c,var(--ac));display:grid;place-items:center;flex:none}
.ic svg{width:24px;height:24px}
.ex{display:grid;grid-template-columns:repeat(3,1fr);gap:36px 32px}
@media(max-width:860px){.ex{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.ex{grid-template-columns:1fr}}
.ex div p{margin:0;color:var(--mut);font-size:1rem}.ex .ic{margin-bottom:12px}
.svc{border-top:1px solid var(--ln)}
.svc a{display:flex;gap:18px;align-items:center;padding:22px 4px;border-bottom:1px solid var(--ln);text-decoration:none;color:var(--tx);transition:.2s}
.svc a:hover{background:var(--soft);padding-inline:14px}
.svc .t{flex:1}.svc .t p{margin:0;color:var(--mut);font-size:1rem}.svc .ar{color:var(--ac);font-size:1.4rem}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;counter-reset:s;list-style:none;padding:0;margin:0}
@media(max-width:860px){.steps{grid-template-columns:1fr 1fr}}@media(max-width:520px){.steps{grid-template-columns:1fr}}
.steps li{counter-increment:s}.steps li::before{content:counter(s);display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--c,var(--ac));color:#fff;font-weight:800;margin-bottom:10px}
.steps p{margin:0;color:var(--mut);font-size:1rem}
.prn{display:grid;grid-template-columns:200px 1fr;gap:32px;align-items:center;padding:28px 0;border-top:1px solid var(--ln)}
.prn:last-child{border-bottom:1px solid var(--ln)}
.prn .pa{color:var(--ac);background:var(--soft);border-radius:16px;padding:14px}
.prn p{margin:.2em 0 .5em;color:var(--mut)}
@media(max-width:620px){.prn{grid-template-columns:1fr}.prn .pa{max-width:220px}}
.tag{display:inline-block;font-size:.8rem;font-weight:700;color:var(--c,var(--ac));background:color-mix(in srgb,var(--c,var(--ac)) 12%,#fff);border-radius:99px;padding:1px 10px;margin-inline-start:6px;vertical-align:middle}
.band{background:linear-gradient(120deg,var(--ac) 0%,#1864ab 55%,var(--sls) 100%);color:#fff;border-radius:20px;padding:44px 36px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.band h2{margin:0}.band p{margin:.3em 0 0;opacity:.9}.band .btn{background:#fff;color:var(--ac);border-color:#fff}
.page{padding:56px 0 80px}
.crumb{font-size:.9rem;color:var(--mut);margin-bottom:6px}.crumb a{text-decoration:none}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:40px}@media(max-width:760px){.cols{grid-template-columns:1fr}}
.good li,.less li{margin:.35em 0;padding-inline-start:4px}
.good{list-style:none;padding:0}.good li::before{content:"✓";color:var(--ok);font-weight:800;margin-inline-end:10px}
.less{list-style:none;padding:0}.less li::before{content:"–";color:var(--mut);font-weight:800;margin-inline-end:10px}
.box{background:var(--soft);border-radius:16px;padding:24px 26px}
.note{font-size:.92rem;color:var(--mut);border-inline-start:3px solid var(--ln);padding:4px 14px;margin:20px 0}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.97rem}
th,td{padding:12px 14px;text-align:start;vertical-align:top;border-bottom:1px solid var(--ln)}
thead th{font-size:.9rem;color:var(--mut);font-weight:700;border-bottom:2px solid var(--ln)}
tbody th{font-weight:700;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 24px}
.chip{border:1px solid var(--ln);background:#fff;border-radius:99px;padding:8px 16px;font:inherit;font-size:.95rem;cursor:pointer;color:var(--tx)}
.chip[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#fff}
.chip:hover{border-color:var(--ac)}
.chip.lg[aria-pressed="true"]{background:#fff;color:var(--tx);border:2px solid var(--tx);font-weight:700}.chip.lg[aria-pressed="false"]{opacity:.55}
.mats{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}@media(max-width:760px){.mats{grid-template-columns:1fr}}
.mat{border:1px solid var(--ln);border-radius:16px;padding:22px 24px;background:#fff}
.mat[hidden]{display:none}
.mat .nick{color:var(--ac);font-weight:700;font-size:.95rem}
.mat p{margin:.4em 0;font-size:1rem;color:var(--mut)}.mat p b{color:var(--tx)}
.rate{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:14px 0 6px;font-size:.92rem;align-items:center}
.dots{display:flex;gap:4px}.dots i{width:22px;height:7px;border-radius:4px;background:var(--ln)}.dots i.on{background:var(--ac)}
.pr{font-size:.85rem!important}
.choose{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:18px 0}
.opt{text-align:start;border:1px solid var(--ln);background:#fff;border-radius:14px;padding:14px 16px;font:inherit;font-size:1rem;cursor:pointer;color:var(--tx);display:flex;gap:12px;align-items:center}
.opt:hover{border-color:var(--ac)}.opt[aria-pressed="true"]{border-color:var(--ac);background:var(--acs);box-shadow:inset 0 0 0 1px var(--ac)}
.opt .ic{width:36px;height:36px}.opt .ic svg{width:20px;height:20px}
.rec{border-radius:16px;background:var(--acs);padding:24px 26px;margin-top:8px}
.rec h3{color:var(--ac);font-size:1.3rem}
details{border:1px solid var(--ln);border-radius:16px;padding:0 22px;margin:22px 0;background:#fff}
summary{cursor:pointer;padding:18px 0;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::after{content:"+";color:var(--ac);font-size:1.4rem;line-height:1}details[open] summary::after{content:"–"}
details>div{padding-bottom:22px}
.cw{position:relative}.cw svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:#fff;color:var(--tx);border:1px solid var(--ln);box-shadow:0 8px 24px rgba(0,0,0,.12);border-radius:10px;padding:8px 12px;font-size:.85rem;display:none;white-space:nowrap;z-index:5}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.2s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}
.res{list-style:none;padding:0;margin:14px 0}.res li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}
.st{font-weight:700;white-space:nowrap}.st.g{color:var(--ok)}.st.a{color:var(--mid)}.st.r{color:var(--bad)}.st.na{color:var(--mut);font-weight:400}
td.g{color:var(--ok)}td.a{color:var(--mid)}td.r{color:var(--bad);font-weight:700}td.na{color:var(--mut)}
select,input,textarea{font:inherit;font-size:1rem;color:var(--tx);background:#fff;border:1px solid #cbd2da;border-radius:10px;padding:10px 12px;width:100%}
label{display:block;font-weight:500;margin:14px 0 6px}
.contact{display:grid;grid-template-columns:.9fr 1.1fr;gap:40px}@media(max-width:820px){.contact{grid-template-columns:1fr}}
.cinfo{list-style:none;padding:0;margin:0}.cinfo li{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--ln)}
.cinfo b{display:block}.mail{font-size:1.15rem;font-weight:700;word-break:break-all}

.c-fdm{--c:var(--fdm)}.c-sla{--c:var(--sla)}.c-sls{--c:var(--sls)}.c-grn{--c:var(--grn)}.c-pnk{--c:var(--pnk)}.c-yel{--c:var(--yel)}.c-ac{--c:var(--ac)}
.prn .pa,.tc-art{color:var(--c,var(--ac));background:color-mix(in srgb,var(--c,var(--ac)) 7%,#fff)}
.page .lead a,.page p a{color:var(--c,var(--ac))}
.size{display:inline-flex;align-items:center;gap:6px;font-size:.92rem;font-weight:700;color:var(--tx);background:var(--soft);border-radius:8px;padding:3px 10px;margin:2px 0 8px}
.size small{font-weight:400;color:var(--mut)}
.mat{border-top:4px solid var(--c,var(--ac))}.mat .nick{color:var(--c,var(--ac))}.mat .dots i.on{background:var(--c,var(--ac))}
.hero-art .l{fill:none}
.top.stu{color:var(--fdm);font-weight:700}
th button.sort{all:unset;cursor:pointer;color:inherit;font-weight:700}th button.sort:focus-visible{outline:3px solid var(--ac)}
th[aria-sort="ascending"] .sort::after{content:" ▲"}th[aria-sort="descending"] .sort::after{content:" ▼"}
.ft td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.ebar{display:inline-block;height:6px;border-radius:3px;background:var(--fdm);vertical-align:middle;margin-inline-start:8px;opacity:.75}
.grp{display:inline-block;font-size:.75rem;font-weight:700;border-radius:6px;padding:0 7px;color:#fff}
.stu-hero{background:linear-gradient(135deg,color-mix(in srgb,var(--fdm) 10%,#fff),#fff 60%);padding:64px 0 40px;border-bottom:1px solid var(--ln)}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.toc button{border:1px solid var(--ln);background:#fff;border-radius:99px;padding:7px 14px;font:inherit;font-size:.92rem;cursor:pointer;color:var(--tx)}
.toc button:hover{border-color:var(--fdm);color:var(--fdm)}
.gs{scroll-margin-top:72px;padding:56px 0;border-bottom:1px solid var(--ln)}
.gs h2{display:flex;align-items:center;gap:12px}
.gs h2 .num{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--c,var(--fdm));color:#fff;font-size:1.1rem;flex:none}
.gs h3{margin-top:1.4em}
.fig{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin:20px 0}
.fig figure{margin:0;border:1px solid var(--ln);border-radius:16px;padding:16px;background:#fff}
.fig figcaption{font-size:.92rem;color:var(--mut);margin-top:8px}
.fig figcaption b{color:var(--tx)}
.fig svg{width:100%;height:auto;display:block}
.bad{color:var(--bad);font-weight:700}.okc{color:var(--ok);font-weight:700}
.rules td:first-child{font-weight:700}
.chk{list-style:none;padding:0}.chk li{margin:6px 0}.chk label{display:flex;gap:12px;align-items:flex-start;font-weight:400;margin:0;cursor:pointer}
.chk input{width:20px;height:20px;flex:none;margin-top:5px;accent-color:var(--fdm)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:18px 0}
.kv div{background:var(--soft);border-radius:12px;padding:12px 14px}.kv b{display:block;font-size:1.15rem;color:var(--fdm)}.kv span{font-size:.88rem;color:var(--mut)}
.tip2{background:color-mix(in srgb,var(--fdm) 8%,#fff);border-inline-start:4px solid var(--fdm);border-radius:10px;padding:12px 16px;margin:16px 0}
footer{border-top:1px solid var(--ln);padding:36px 0;color:var(--mut);font-size:.92rem}
.fg{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px}
.js .rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}.js .rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.js .rv{opacity:1;transform:none;transition:none}.dr{animation:none;stroke-dashoffset:0}*{transition:none!important}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<a class="skip" href="#m">דילוג לתוכן</a>
<header id="hd"><div class="wrap hb">
 <a class="logo" href="#home"><b>מעבדת תלת־ממד</b><span>אוניברסיטת בן־גוריון בנגב</span></a>
  <nav id="nv" aria-label="ניווט ראשי"><ul class="nav" id="nav"></ul></nav>
</div></header>
<main id="m" tabindex="-1"></main>
<footer><div class="wrap fg">
 <div><b style="color:var(--tx)">מעבדת תלת־ממד – המעבדה של פרופ׳ אמיר שפירא</b><br>בניין 57, מעבדה 2 · אוניברסיטת בן־גוריון בנגב, באר שבע</div>
 <div><a href="mailto:bgu.amc@gmail.com">bgu.amc@gmail.com</a><br><a href="#contact">ליצירת קשר</a></div>
</div></footer>
<script>
document.documentElement.classList.add('js');
const EMAIL='bgu.amc@gmail.com';
/* ---------- icons ---------- */
const I=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const IC={
cube:I('<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>'),
wrench:I('<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-.6-.6-2.5z"/>'),
chip:I('<rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 9h6v6H9zM9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>'),
flask:I('<path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2h12.4a1.5 1.5 0 0 0 1.3-2L14 9V3"/><path d="M7 15h10"/>'),
build:I('<path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6"/>'),
wave:I('<path d="M3 12c2-4 4-4 6 0s4 4 6 0 4-4 6 0"/><path d="M3 17c2-4 4-4 6 0s4 4 6 0 4-4 6 0" opacity=".5"/>'),
eye:I('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),
gear:I('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'),
laser:I('<path d="M12 2v4M9 6h6l-1 4h-4z"/><path d="M12 10v7" stroke-dasharray="2 2"/><path d="M3 20h18M7 17h10"/>'),
scan:I('<path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3"/><path d="M3 12h18"/>'),
pen:I('<path d="M3 21l3.5-1L19 7.5a2.1 2.1 0 0 0-3-3L3.5 17z"/><path d="M14.5 6l3 3"/>'),
printer:I('<path d="M4 20V4h16v16"/><path d="M4 9h16"/><path d="M10 9v3l2 2 2-2V9"/><path d="M8 20h8v-3H8z"/>'),
drop:I('<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>'),

   g+=`<path d="${pts}" class="dr" pathLength="1" stroke="${d.c}" stroke-width="2.6" fill="none"/><circle cx="${X(d.p.eb)}" cy="${Y(d.f(d.p.eb/100))}" r="4.5" fill="#fff" stroke="${d.c}" stroke-width="2.5"/>`});
  g+=`<line data-v y1="${mt}" y2="${H-mb}" stroke="#0f4c81" stroke-dasharray="4" opacity="0"/><rect data-o x="${ml}" y="${mt}" width="${pw}" height="${ph}" fill="transparent"/>`;

}

scan:{t:'סריקה בתלת־ממד',h:()=>`<div class="wrap page c-grn"><div class="cols" style="align-items:center"><div class="rv"><div class="crumb">שירות</div><h1>סריקה בתלת־ממד</h1><div class="size">הסורק: EinScan Pro HD</div><p class="lead">סריקה בתלת־ממד הופכת חפץ אמיתי לקובץ דיגיטלי. הקובץ מתאר את הצורה המדויקת של פני השטח – ואפשר למדוד אותו, לשנות אותו במחשב או להדפיס ממנו עותק.</p></div><div class="rv tc-art" style="max-width:360px;border-radius:20px;padding:18px">${ART.scan}</div></div>

<h3>חיתוך לעומת חריטה</h3><ul><li><b>חיתוך</b> – הלייזר עובר לאורך קווים וחותך את הלוח עד הסוף. מתאים לחלקים, למארזים ולתבניות.</li><li><b>חריטה</b> – הלייזר „צובע” שטח ושורף רק את השכבה העליונה. מתאים לטקסט, לוגו ותמונות.</li></ul></div>

<div class="box" style="margin-top:20px"><h3>חומרים</h3><p style="margin:.2em 0"><b class="okc">מתאים:</b> עץ ודיקט, MDF, אקריליק (פרספקס), קרטון ונייר, עור, בד וגומי ייעודי.</p><p style="margin:.2em 0"><b class="okc">חריטה בלבד:</b> זכוכית, אבן, אלומיניום מאולגן.</p><p style="margin:.2em 0"><b class="bad">אסור:</b> PVC וויניל – משחררים גז רעיל ומזיק למכונה. מתכת אי אפשר לחתוך.</p></div></div></div>

pages['fdm-materials']={t:'סוגי פלסטיק',h:()=>`<div class="wrap page c-fdm"><div class="rv"><div class="crumb"><a href="#fdm">FDM – הדפסה בחוט פלסטיק</a></div><h1>סוגי פלסטיק</h1><p class="lead">סינון לפי מה שהחלק צריך מציג את החומרים המתאימים. לבחירה מדויקת – אפשר לפנות במייל ולתאר למה החלק ישמש.</p></div>
<div id="mf"><div class="chips rv" role="group" aria-label="סינון לפי צורך"></div><div class="mats">${FM.map((m,i)=>`<article class="mat rv c-${['fdm','pnk','ac','grn','grn','sla','yel','yel','sls','pnk','ac','fdm','sls','sla','fdm'][i]}" data-t="${m[6]}"><h3>${m[0]}</h3><div class="nick">${m[1]}</div><p>${m[2]}</p><p><b>מתאים ל:</b> ${m[3]}</p><dl class="rate">${dots(m[4][0],'חוזק')}${dots(m[4][1],'גמישות')}${dots(m[4][2],'עמידות לחום')}${dots(m[4][3],'שימוש בחוץ')}</dl><p class="pr">מדפסות: ${m[5]}</p></article>`).join('')}</div></div>
<p class="note">הדירוגים הם הערכה כללית להשוואה בין החומרים, ולא נתון הנדסי. מלאי החומרים משתנה – לבירור זמינות במייל.</p>
<h2 class="rv" id="ft-h" style="margin-top:56px">כל החומרים של Bambu Lab – נתונים טכניים</h2><p class="rv" style="color:var(--mut)">כל קווי הפילמנט של Bambu Lab, עם נתונים מגיליונות הנתונים הטכניים של היצרן. אפשר למיין לפי כל עמודה ולסנן לפי משפחה. <b>מודול יאנג</b> = קשיחות (כמה החומר מתנגד לעיוות); <b>Tg</b> = טמפרטורת מעבר זכוכית (שם החומר מתחיל להתרכך); <b>HDT</b> = הטמפרטורה שבה מוט סטנדרטי מתכופף תחת עומס קל של 0.45 MPa.</p><div id="ft" class="rv"></div><p class="note">ערכים בכיוון XY (לאורך השכבות), לפי ISO 527 ו־ISO 75 כפי שמופיעים בגיליונות Bambu Lab. „—” = לא מופיע בגיליון. בחומרים עם סיבי פחמן המודול בכיוון XY גבוה במיוחד, כי הסיבים מסתדרים לאורך קו ההדפסה; בכיוון Z (בין השכבות) הוא נמוך בהרבה. הרשימה היא קטלוג היצרן – לא כל החומרים במלאי.</p>
<div class="cols" style="margin-top:48px"><div class="rv"><h2>מה זה CF – סיבי פחמן?</h2><p>חומרים שמסתיימים ב־CF מכילים סיבי פחמן קצרים. הם הופכים את החלק לקשיח יותר, יציב יותר ובעל גימור מט יפה. מצד שני, החלק פחות גמיש ועלול להישבר במכה חדה במקום להתכופף. GF הם סיבי זכוכית – פחות קשיחים, ופחות שבירים.</p></div>
<div class="rv"><h2>מה זה FR – מעכב בעירה?</h2><p>חומרי FR מכילים תוספים שמקשים על האש להתפשט. מקובל לדרג אותם לפי התקן <b>UL 94</b>, שבודק מה קורה כשמדליקים דוגמה של החומר:</p></div></div>
<div class="sc rv"><table><thead><tr><th>דירוג</th><th>מה זה אומר</th></tr></thead><tbody><tr><th>V‑0</th><td>הדירוג הטוב ביותר. האש כבה תוך 10 שניות, ולא נופלות טיפות בוערות.</td></tr><tr><th>V‑1</th><td>האש כבה תוך 30 שניות, ולא נופלות טיפות בוערות.</td></tr><tr><th>V‑2</th><td>האש כבה תוך 30 שניות, אבל עלולות ליפול טיפות בוערות.</td></tr><tr><th>HB</th><td>הדירוג הבסיסי: החומר בוער לאט כשהוא מונח אופקית.</td></tr></tbody></table></div>
<p class="note">הדירוג ניתן לחומר בעובי מסוים, ולא לכל חלק מודפס. אם החלק צריך לעמוד בתקן – יש לציין זאת בפנייה.</p>
<details class="rv"><summary>למתקדמים: השוואת חוזק בגרף מאמץ־מעוות</summary><div><p style="color:var(--mut)">הגרף מראה כמה כוח החומר מחזיק (למעלה) וכמה הוא נמתח (ימינה) עד שהוא נשבר (העיגול). עקומה גבוהה = חזק; עקומה ארוכה = נמתח לפני שבירה. בחלק מודפס, הכיוון „בין השכבות” חלש יותר.</p><div id="g1"></div><p class="note">העקומות הן הדמיה שמבוססת על נתוני Bambu Lab (גיליונות נתונים טכניים, ISO 527). ערכים עם * משוערים.</p></div></details></div>${band()}`};

${SEC('s-quiz',2,'pnk','שאלון בחירת חומר',`<p class="rv">חמש שאלות על השימוש בחלק – ומתקבלת המלצה על חומרים, עם הנתונים שלהם. לחישובים ולהשוואה מלאה יש באתר <a href="#fdm-materials">טבלה של כל החומרים</a> עם מודול יאנג, חוזק מתיחה, Tg ו־HDT – מומלץ להשתמש בה לפי הצורך.</p><div class="box rv" id="quiz"></div>
<div class="cols rv" style="margin-top:22px"><div><h3 style="margin-top:0">Tg ו־HDT בקצרה</h3><p><b>Tg</b> – הטמפרטורה שבה החומר מתחיל להתרכך. <b>HDT</b> – הטמפרטורה שבה מוט סטנדרטי מתכופף תחת עומס קל. לבחירת חומר לפי טמפרטורת עבודה, HDT הוא הנתון השימושי יותר.</p></div><div><h3 style="margin-top:0">למה ל־PA6‑CF יש Tg של 68°C אבל HDT של 186°C?</h3><p>בחומרים חצי־גבישיים ומחוזקי סיבים, האזורים הגבישיים והסיבים ממשיכים לשאת עומס גם מעל ה־Tg. בחומרים אמורפיים (PLA, PETG, PC) שני הערכים קרובים.</p></div></div>`)}
${SEC('s-h2c',3,'sls','H2C: כמה צבעים וחומרים באותו חלק',`<div class="cols"><div class="rv"><p>ב־H2C אפשר להדפיס <b>כמה צבעים</b> באותו חלק – לסימון, להבחנה בין חלקים או למראה.</p><p>היתרון הגדול לתכנון: <b>שילוב חומר קשיח וחומר גמיש באותו חלק</b>, בהדפסה אחת ובלי הרכבה. לדוגמה, קורה עם שני קצוות קשיחים ממקטע TPU גמיש באמצע – הקורה מתכופפת רק באזור הגמיש, כמו ציר.</p><p>עוד דוגמאות: ידית עם אחיזה רכה, רגליות מונעות החלקה, אטם מובנה במכסה, בולם זעזועים בתוך תושבת.</p><p>התא הסגור והמחומם של המדפסת מאפשר להדפיס גם חומרים הנדסיים, כמו פוליקרבונט וניילון מחוזק.</p><div class="tip2"><b>איך מתכננים חלק משולב?</b> מתכננים כל חומר כגוף (Body) נפרד באותו קובץ, ומציינים במייל איזה גוף מאיזה חומר. כדאי לתכנן שטח מגע גדול בין שני החומרים – למשל חפיפה או שיניים – כי החיבור ביניהם הוא נקודת החולשה.</div></div><figure class="fig rv" style="display:block;margin:0"><figure>${DG.flex}<figcaption><b>קורה משולבת.</b> PETG קשיח בקצוות ו־TPU גמיש באמצע – מודפסת כיחידה אחת.</figcaption></figure></figure></div>
<div class="kv rv"><div><b>30.5 × 32 × 32.5 ס״מ</b><span>גודל מרבי של חלק</span></div><div><b>חלקים ארוכים יותר</b><span>במדפסת המסוע CR‑30</span></div><div><b>תמיכה מסיסה</b><span>ב־METHOD X</span></div></div>`)}
${SEC('s-fdm',4,'yel','איך FDM עובד',`<div class="cols"><div class="rv"><p>במדפסת תלת־ממד רגילה, חוט פלסטיק מותך ונדחף דרך נחיר, ומונח בקווים לפי מסלול. כל שכבה נבנית מעל הקודמת. החלק בנוי מ:</p><ul><li><b>דפנות</b> – הקווים שמקיפים כל שכבה. הן נותנות את רוב החוזק.</li><li><b>שכבות עליונות ותחתונות</b> – „עור” מלא למעלה ולמטה.</li><li><b>מילוי</b> – מבנה פנימי חלקי. ההגדרה נקבעת בהכנה להדפסה, לפי השימוש בחלק.</li></ul></div>
<div class="rv"><h3 style="margin-top:0">שלושה דברים לזכור בתכנון</h3><ol><li><b>כל שכבה צריכה משהו מתחתיה.</b> אי אפשר להדפיס באוויר.</li><li><b>החומר אנאיזוטרופי</b> – התכונות לאורך השכבות שונות מהתכונות בין השכבות.</li><li><b>חורים ומידות</b> יוצאים מעט שונים מהתכנון – ראו טבלת כללי התכנון.</li></ol></div></div>`)}
${SEC('s-sup',5,'fdm','תמיכות, overhangs וזיזים',`<div class="rv"><p>במדפסת תלת־ממד רגילה, כל שכבה חייבת לשבת על השכבה שמתחתיה. שכבה שזזה קצת הצידה עדיין נשענת על הקודמת – אבל מעבר לזווית מסוימת היא נופלת. <b>כלל האצבע: עד 45° מהאנך – בלי תמיכה.</b> מעבר לזה צריך תמיכה: מבנה זמני שמודפס מתחת לחלק ומוסר בסוף. תמיכות מוסיפות זמן וחומר ומשאירות סימנים על המשטח.</p></div>
<div class="fig rv"><figure>${DG.angle}<figcaption><b>זווית Overhang.</b> עד 45° כל שכבה נשענת מספיק על הקודמת. מעבר לזה – השכבה תלויה באוויר.</figcaption></figure><figure>${DG.island}<figcaption><b>אין אזורים מרחפים.</b> חלק שמתחיל באמצע האוויר יודפס על כלום ויקרוס. צריך לחבר אותו בשיפוע – או להוסיף תמיכה.</figcaption></figure></div>
<h3 class="rv">זיז שיוצא מעמוד: פאזה של 45°</h3><p class="rv">זיז אופקי שיוצא מעמוד מתחיל באוויר, ולכן צריך תמיכה מתחתיו. <b>אם התכן מאפשר, אפשר להוסיף מתחת לזיז פאזה של 45°.</b> אם מוסיפים פאזה – היא צריכה להיות <b>לאורך כל הזיז, עד הקצה שלו</b>. כך כל שכבה נבנית מעט הלאה מהקודמת, והזיז מודפס בלי תמיכה בכלל. בונוס: הפאזה גם מחזקת את השורש של הזיז.</p>
<div class="fig rv"><figure>${DG.tab}<figcaption><b>זיז מעמוד.</b> מימין: בלי פאזה – צריך תמיכה מלאה. משמאל: פאזה של 45° לאורך כל הזיז – אין צורך בתמיכה.</figcaption></figure><figure>${DG.edge}<figcaption><b>קצוות תחתונים.</b> רדיוס בתחתית החלק מתחיל כמעט אופקי, ולכן הוא overhang. פאזה של 45° מודפסת נקי. רדיוסים בקצוות העליונים והאנכיים – בלי בעיה.</figcaption></figure></div>
<div class="cols rv"><div><h3>חורים אופקיים</h3><p>רק בחורים קטנים מאוד (עד כ־2 מ״מ) כדאי לשקול צורת „טיפה” – חור עם קצה עליון מחודד ב־45°. בחורים גדולים יותר אין צורך.</p></div><div><h3>כשאין ברירה – תמיכה</h3><p>ב־H2C אפשר להדפיס את שכבת המגע של התמיכה מחומר אחר, שנפרד בקלות ומשאיר משטח נקי יחסית.</p></div></div>`)}
${SEC('s-rules',6,'grn','כללי תכנון – טבלת עזר',`<p class="rv">ערכים טיפוסיים במדפסת תלת־ממד רגילה. בהתאמה קריטית – כדאי להדפיס קודם חלק בדיקה קטן.</p><div class="sc rv"><table class="rules"><thead><tr><th>נושא</th><th>ערך מומלץ</th><th>הערות</th></tr></thead><tbody>${RULES.map(r=>`<tr><td>${r[0]}</td><td style="white-space:nowrap">${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div>
<div class="cols" style="margin-top:28px"><div class="rv"><h3>חלקים גדולים ושטוחים</h3><p>במדפסת תלת־ממד רגילה, חומרים כמו ABS, ASA, PC וניילון מתכווצים בקירור, ומשטחים גדולים ושטוחים עלולים להתעקם בפינות. עוזר לתכנן פינות מעוגלות (במבט מלמעלה), צלעות במקום לוח עבה ועובי אחיד ככל האפשר.</p></div>
<div class="rv"><h3>חלק גדול מהמדפסת</h3><p>מפצלים לכמה חלקים ומחברים: פינים מיישרים, זנב יונה, ברגים או הדבקה. כדאי שקו החיבור יעבור באזור עם עומס נמוך.</p></div>
<div class="rv"><h3>קליפסים וזרועות קפיציות</h3><p>לתכנן כך שהזרוע מודפסת לאורך השכבות, ומחומר קשוח כמו PETG, PC או ניילון. PLA נוטה להישבר בכיפוף חוזר.</p></div>
<div class="rv"><h3>תכונות החומר לחישובים</h3><p>לחישובי קשיחות וחוזק – <a href="#fdm-materials">טבלת החומרים</a> כוללת מודול יאנג, חוזק מתיחה, Tg ו־HDT מגיליונות היצרן. הערכים נמדדים על דגימות סטנדרטיות, ולכן מומלץ לתכנן עם מקדם ביטחון.</p></div></div>`)}
${SEC('s-ins',7,'yel','אינסרטים מפליז',`<div class="cols"><div class="rv"><p>כשבורג מוברג ישירות לפלסטיק, התבריג נשחק אחרי כמה פעמים. בחלקים שצריך להבריג ולפרק שוב ושוב, או שנושאים עומס על הבורג, משתמשים ב<b>אינסרטים מפליז</b> (Heat‑set inserts): תותבים עם תבריג פנימי, שמוחדרים לחור בעזרת חום ונאחזים היטב בפלסטיק.</p><ul><li>ניתן להביא אינסרטים מפליז במידות המתאימות.</li><li><b>במקרה של שימוש באינסרטים – יש להתייעץ במייל לפני התכנון</b>, כדי שקוטר ועומק החור יתאימו לאינסרט.</li></ul></div><figure class="fig rv" style="display:block;margin:0"><figure>${DG.insert}<figcaption><b>אינסרט פליז</b> מוחדר בחום לחור בחלק, ונותן תבריג מתכתי עמיד.</figcaption></figure></figure></div>`)}
${SEC('s-orient',8,'sla','כיוון ההדפסה: חומר אנאיזוטרופי',`<div class="cols"><div class="rv"><p>חלק מודפס הוא <b>חומר אנאיזוטרופי</b>: התכונות שלו תלויות בכיוון. לאורך השכבות הוא חזק יותר מאשר בין השכבות. ב־<b>PET‑CF</b>, לדוגמה, חוזק המתיחה הוא 74 MPa לאורך השכבות ו־35 MPa בין השכבות; ב־<b>PAHT‑CF</b> – 88 מול 64 MPa (גיליונות Bambu Lab).</p><ul><li>כדאי לתכנן כך ש<b>המאמץ העיקרי פועל לאורך השכבות</b>.</li><li>ווים, קליפסים וזרועות – עדיף שישכבו על המשטח ולא יעמדו.</li><li>חורים לברגים – עדיף אנכיים: הם יוצאים עגולים ומדויקים יותר.</li></ul><p>כיוון ההדפסה נבחר בהכנה לפי הגיאומטריה. אם יש העדפה – אפשר לציין אותה במייל.</p></div><figure class="fig rv" style="display:block;margin:0"><figure>${DG.aniso}<figcaption><b>אנאיזוטרופיה.</b> משיכה לאורך השכבות – חזק. משיכה שמפרידה בין השכבות – חלש יותר.</figcaption></figure></figure></div>`)}
${SEC('s-chk',9,'grn','צ׳קליסט לפני שליחה',`<ul class="chk rv">${CHK.map((c,i)=>`<li><label><input type="checkbox" id="ck${i}"> <span>${c}</span></label></li>`).join('')}</ul><p class="rv" id="ckp" style="color:var(--mut)"></p>`)}
${band()}`};
/* ---------- nav ---------- */
const NAV=Object.entries(T).map(([t,x])=>`<li class="it"><button class="top" aria-expanded="false">${x.n} <small>${x.p.replace('הדפסה ב','')}</small></button><div class="dd"><a href="#${t}">מה זה ${x.n}?<span class="hint">${x.p} – בשפה פשוטה</span></a><div class="has"><a href="#${t}">המדפסות במעבדה</a><div class="sub">${PR.filter(k=>P[k].t===t).map(k=>`<a href="#${k}">${P[k].n}</a>`).join('')}</div></div><a href="#${t}-materials">${x.mt}</a></div></li>`).join('')
+`<li class="it"><a class="top" href="#scan">סריקה בתלת־ממד</a></li><li class="it"><a class="top" href="#laser">חיתוך לייזר</a></li><li class="it"><a class="top stu" href="#students">סטודנטים</a></li><li class="it"><a class="top cta" href="#contact">יצירת קשר</a></li>`;
const hd=document.getElementById('hd'),nav=document.getElementById('nav');nav.innerHTML=NAV;
const closeAll=except=>nav.querySelectorAll('.it.open').forEach(i=>{if(i!==except){i.classList.remove('open');i.querySelector('.top').setAttribute('aria-expanded','false')}});
nav.querySelectorAll('button.top').forEach(b=>b.onclick=()=>{const it=b.parentElement;const o=!it.classList.contains('open');closeAll(it);it.classList.toggle('open',o);b.setAttribute('aria-expanded',o)});
document.addEventListener('click',e=>{if(!nav.contains(e.target))closeAll()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
/* ---------- router ---------- */
const m=document.getElementById('m');let first=true;
function render(){
 const id=location.hash.slice(1)||'home';if(id==='m')return;
 const pg=pages[id]||pages.home;m.innerHTML=pg.h();document.title=pg.t+' | מעבדת תלת־ממד BGU';
 closeAll();nav.querySelectorAll('.top').forEach(a=>a.removeAttribute('aria-current'));const cur=nav.querySelector(`a.top[href="#${id}"]`);if(cur)cur.setAttribute('aria-current','page');
 scrollTo(0,0);if(!first)m.focus({preventScroll:true});first=false;
 const g=n=>document.getElementById(n);
 if(g('mf'))matFilter(g('mf'));if(g('ft'))fullTable(g('ft'));if(g('quiz'))quiz(g('quiz'));
 if(g('g1'))stress(g('g1'),FDMS,true);if(g('g2'))stress(g('g2'),RES,false);if(g('g3'))chem(g('g3'),'sla');if(g('g4'))chem(g('g4'),'sls');
 m.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const t=g(b.dataset.go);if(t){t.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});const h=t.querySelector('h2');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true})}}});
 if(g('ck0')){const cks=[...m.querySelectorAll('.chk input')];const up=()=>{const n=cks.filter(c=>c.checked).length;g('ckp').textContent=n===cks.length?'✓ הכל מסומן – אפשר לשלוח':`סומנו ${n} מתוך ${cks.length}`};cks.forEach(c=>c.onchange=up);up()}
 if(g('sf')){g('sf').onsubmit=e=>{e.preventDefault();const v=id=>g(id).value.trim();const sub=`הדפסה לפרויקט ${v('s-p')} – ${v('s-n')}`;const body=`שם: ${v('s-n')}\nפרויקט: ${v('s-p')} (פרופ׳ אמיר שפירא)\nחומר: ${v('s-m')}\nכמות: ${v('s-q')}\n\n${v('s-d')?'על הפרויקט והחלק:\n'+v('s-d')+'\n\n':''}מצורף קובץ STEP.\n`;location.href=`mailto:${EMAIL}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(body)}`}}
 if(g('cf')){g('cf').onsubmit=e=>{e.preventDefault();const n=g('f-n').value.trim(),s=g('f-s').value,msg=g('f-m').value.trim();location.href=`mailto:${EMAIL}?subject=${encodeURIComponent('פנייה למעבדת תלת־ממד – '+s)}&body=${encodeURIComponent(`שם: ${n}\nשירות: ${s}\n\n${msg}\n`)}`};
  g('cp').onclick=async()=>{try{await navigator.clipboard.writeText(EMAIL);g('cp').textContent='הועתק ✓'}catch(_){g('cp').textContent=EMAIL}}}
 if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.06,rootMargin:'0px 0px -30px 0px'});m.querySelectorAll('.rv').forEach(e=>io.observe(e))}else m.querySelectorAll('.rv').forEach(e=>e.classList.add('in'));
}
const FDMS=[['PLA',{E:2600,su:39,eb:12.2,est:1},{E:2400,su:35,eb:7.5,est:1}],['PLA‑CF',{E:3500,su:38,eb:8.4,est:1},{E:2160,su:26,eb:3.6}],['PETG‑CF',{E:3000,su:59,eb:10.4,est:1},{E:1800,su:38,eb:4.7,est:1}],['PET‑CF',{E:4730,su:74,eb:4.5},{E:2160,su:35,eb:2.4}],['PAHT‑CF',{E:3860,su:88,eb:10.4},{E:2180,su:64,eb:5.2}]].map(r=>({n:r[0],get:o=>o==='xy'?r[1]:r[2]}));
const RES=[['Standard',2800,65,6,0],['Tough 2000',2200,46,48,0],['Tough 1500',1500,33,51,0],['Durable',1260,31.8,49,0],['Rigid 4000',4100,69,5.3,1],['Rigid 10K',10000,65,1,1]].map(r=>({n:r[0],E:r[1],su:r[2],eb:r[3],est:r[4],k:r[3]<3?6:r[3]<10?4:3}));
addEventListener('hashchange',render);render();
</script>
